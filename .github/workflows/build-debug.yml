name: Build Debug APK (Custom Key)

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build-debug:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Accept Android SDK licenses (preinstalled SDK)
        run: |
          SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          mkdir -p "$SDK_DIR/licenses"
          yes | "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Fix gradle.properties for Linux CI runner
        run: |
          # Remove Termux/ARM local AAPT2 override so Gradle uses Maven AAPT2 on Ubuntu CI
          if [ -f gradle.properties ]; then
            sed -i '/android\.aapt2FromMavenOverride/d' gradle.properties
          fi

      - name: Ensure gradlew is executable
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --build-cache --stacktrace

      - name: Sign Debug APK with public custom keystore
        env:
          # Optional GitHub Secrets override if you ever switch to a private key later
          SECRET_KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          SECRET_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SECRET_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SECRET_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          APK_IN="app/build/outputs/apk/debug/app-debug.apk"
          APK_OUT="app/build/outputs/apk/debug/StudioRblx-debug-signed.apk"

          if [ -n "${SECRET_KEYSTORE_BASE64:-}" ] && [ -n "${SECRET_KEYSTORE_PASSWORD:-}" ] && [ -n "${SECRET_KEY_ALIAS:-}" ]; then
            echo "Using custom keystore from GitHub Secrets..."
            echo "$SECRET_KEYSTORE_BASE64" | base64 --decode > /tmp/signing.jks
            KS_FILE="/tmp/signing.jks"
            KS_PASS="$SECRET_KEYSTORE_PASSWORD"
            KS_ALIAS="$SECRET_KEY_ALIAS"
            KEY_PASS="${SECRET_KEY_PASSWORD:-$SECRET_KEYSTORE_PASSWORD}"
          elif [ -f "signing/studrblx-public.jks" ]; then
            echo "Using public repo keystore at signing/studrblx-public.jks..."
            KS_FILE="signing/studrblx-public.jks"
            KS_PASS="studrblx123"
            KS_ALIAS="studrblx"
            KEY_PASS="studrblx123"
          elif [ -f "studrblx-public.jks" ]; then
            echo "Using public repo keystore at studrblx-public.jks..."
            KS_FILE="studrblx-public.jks"
            KS_PASS="studrblx123"
            KS_ALIAS="studrblx"
            KEY_PASS="studrblx123"
          else
            echo "::error::Keystore not found! Commit studrblx-public.jks to repo root or signing/studrblx-public.jks."
            exit 1
          fi

          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          echo "Using build-tools: $BUILD_TOOLS"

          "$BUILD_TOOLS/zipalign" -f -p 4 "$APK_IN" /tmp/aligned.apk
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$KS_FILE" \
            --ks-pass "pass:$KS_PASS" \
            --ks-key-alias "$KS_ALIAS" \
            --key-pass "pass:$KEY_PASS" \
            --out "$APK_OUT" \
            /tmp/aligned.apk

          "$BUILD_TOOLS/apksigner" verify --verbose "$APK_OUT"
          rm -f /tmp/signing.jks /tmp/aligned.apk

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: StudioRblx-debug-apk
          path: app/build/outputs/apk/debug/StudioRblx-debug-signed.apk
          if-no-files-found: error
