name: Build Debug APK (Custom Key)

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build-debug:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Accept Android SDK licenses (preinstalled SDK)
        run: |
          SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          mkdir -p "$SDK_DIR/licenses"
          yes | "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Ensure gradlew is executable
        run: chmod +x ./gradlew

        - name: Remove local AAPT2 override
  run: sed -i '/android\.aapt2FromMavenOverride/d' gradle.properties

      - name: Build Debug APK
        run: ./gradlew assembleDebug --build-cache --stacktrace

      - name: Sign Debug APK with custom keystore (if configured)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          APK_IN="app/build/outputs/apk/debug/app-debug.apk"
          APK_OUT="app/build/outputs/apk/debug/StudioRblx-debug-signed.apk"
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > /tmp/release.keystore
            BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
            "$BUILD_TOOLS/zipalign" -f -p 4 "$APK_IN" /tmp/aligned.apk
            "$BUILD_TOOLS/apksigner" sign \
              --ks /tmp/release.keystore \
              --ks-pass "pass:$KEYSTORE_PASSWORD" \
              --ks-key-alias "$KEY_ALIAS" \
              --key-pass "pass:${KEY_PASSWORD:-$KEYSTORE_PASSWORD}" \
              --out "$APK_OUT" \
              /tmp/aligned.apk
            "$BUILD_TOOLS/apksigner" verify --verbose "$APK_OUT"
            rm -f /tmp/release.keystore /tmp/aligned.apk
          else
            echo "Custom keystore secrets not set; uploading default debug APK."
            cp "$APK_IN" "$APK_OUT"
          fi

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: StudioRblx-debug-apk
          path: app/build/outputs/apk/debug/StudioRblx-debug-signed.apk
          if-no-files-found: error
